<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteWave - Minhas Medalhas</title>
    <link rel="stylesheet" href="../css/medalhas.css">
</head>
<body>

<div class="container">

    <a href="perfil.html" class="btn-voltar">← Voltar para o Perfil</a>

    <header class="page-header">
        <h1>🎵 Suas Conquistas Musicais</h1>
        <p>Acompanhe todas as medalhas conquistadas durante sua jornada no NoteWave.</p>
    </header>

    <div class="grid-medalhas">

        <!-- Medalha 1 -->
        <div class="card-medalha"

            data-aprendeu="Leitura da pauta, identificação das notas e localização da Clave de Sol."
            data-incentivo="Continue praticando! Grandes músicos começaram exatamente assim.">

            <div class="icone-medalha">
                <svg viewBox="0 0 100 100" style="width: 55px; height: 55px;">
                    <path fill="currentColor" d="M54.5,9 C50.1,9 46.2,16.5 45.1,25.4 C38.3,29.8 33.2,36.5 33.2,46.1 C33.2,58.3 42.1,65.2 50.5,65.2 C59.2,65.2 65.5,58.1 65.5,48.5 C65.5,41.3 61.2,35.4 55.3,32.3 C53.2,23.1 55.4,12.5 58.1,9.8 C56.8,9.2 55.7,9 54.5,9 Z M51.5,59.5 C46.2,59.5 40.8,55.1 40.8,47.2 C40.8,40.5 45.1,34.9 51.2,32.8 C53.2,41.2 57.1,51.8 59.2,56.8 C57.2,58.7 54.5,59.5 51.5,59.5 Z M53.5,67 C48.5,67 44,70.5 44,75.5 C44,80.5 48.5,84.5 53.5,84.5 C58.5,84.5 62.5,80.5 62.5,75.5 C62.5,70.5 58.5,67 53.5,67 Z"/>
                </svg>
            </div>
            <h3>Clave de Sol</h3>
            <span class="status">Bloqueado</span>
        </div>

        <!-- Medalha 2 -->
        <div class="card-medalha"
            data-chave-medalha="medalha_clave_fa"
            data-status="bloqueado"
            data-titulo="Clave de Fá"
            data-conquistou="Você conquistou a leitura dos sons graves."
            data-aprendeu="Reconhecimento das notas da Clave de Fá."
            data-incentivo="Seu conhecimento musical está ficando cada vez mais completo!">

            <div class="icone-medalha">
                <svg viewBox="0 0 100 100" style="width: 50px; height: 50px;">
                    <path fill="currentColor" d="M35,25 C45,20 62,24 62,42 C62,56 50,66 42,75 L36,75 C44,65 54,55 54,43 C54,34 43,30 36,33 L35,25 Z M70,33 A 4 4 0 1 1 70,32.9 Z M70,47 A 4 4 0 1 1 70,46.9 Z"/>
                </svg>
            </div>
            <h3>Clave de Fá</h3>
            <span class="status">Bloqueado</span>
        </div>

        <!-- Medalha 3 -->
        <div class="card-medalha"
            data-chave-medalha="medalha_nota_por_nota"
            data-status="bloqueado"
            data-titulo="Nota por Nota"
            data-conquistou="Você completou uma atividade sem errar nenhuma nota."
            data-aprendeu="Precisão, concentração e leitura musical."
            data-incentivo="A prática leva à perfeição. Continue treinando!">

            <div class="icone-medalha">
                <svg viewBox="0 0 100 100" style="width: 52px; height: 52px;">
                    <path fill="currentColor" d="M35,25 L75,15 L75,55 C70,52 62,52 58,56 C52,62 52,72 58,78 C64,84 74,84 80,78 C83,75 85,70 85,65 L85,25 L45,35 L45,65 C40,62 32,62 28,66 C22,72 22,82 28,88 C34,94 44,94 50,88 C53,85 55,80 55,75 L55,42 L35,47 Z"/>
                </svg>
            </div>
            <h3>Nota por Nota</h3>
            <span class="status">Bloqueado</span>
        </div>

        <!-- Medalha 4 -->
        <div class="card-medalha"
            data-chave-medalha="medalha_ritmo"
            data-status="bloqueado"
            data-titulo="Ritmo e Pulsação"
            data-conquistou="Você dominou a pulsação de tempo de forma regular!"
            data-aprendeu="Padrões de compassos simples e figuras de andamento."
            data-incentivo="Seu metrônomo interno está regulado perfeitamente!">

            <div class="icone-medalha">
                <svg viewBox="0 0 100 100" style="width: 48px; height: 48px;">
                    <path fill="currentColor" d="M50,15 L22,78 L78,78 Z M50,28 L68,70 L32,70 Z M47,42 L53,42 L51,62 L47,62 Z M50,67 A 2.5 2.5 0 1 1 50,66.9 Z"/>
                </svg>
            </div>
            <h3>Ritmo e Pulsação</h3>
            <span class="status">Bloqueado</span>
        </div>

        <!-- Medalha 5 -->
        <div class="card-medalha"
            data-chave-medalha="medalha_avancada"
            data-status="bloqueado"
            data-titulo="Leitura Avançada"
            data-conquistou="Você completou com êxito os exercícios mais difíceis da trilha."
            data-aprendeu="Linhas suplementares complexas e velocidade melódica."
            data-incentivo="Partituras complexas não são mais um mistério para você!">

            <div class="icone-medalha">
                <svg viewBox="0 0 100 100" style="width: 50px; height: 50px;">
                    <path fill="currentColor" d="M25,20 L25,75 C25,83 35,83 35,75 L35,35 L75,35 L75,65 C75,73 85,73 85,65 L85,20 Z M35,45 L75,45 L75,49 L35,49 Z M35,57 L75,57 L75,61 L35,61 Z"/>
                </svg>
            </div>
            <h3>Leitura Avançada</h3>
            <span class="status">Bloqueado</span>
        </div>

    </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalConquista">
    <div class="modal-balao">
        <button id="btnFecharModal" class="btn-fechar">&times;</button>
        <div id="conteudoModal"></div>
    </div>
</div>

<script>
    function atualizarMedalhasPeloProgresso() {
        const cards = document.querySelectorAll('.card-medalha');
        cards.forEach(card => {
            const chave = card.dataset.chaveMedalha;
            const statusTexto = card.querySelector('.status');
            const medalhaConcluida = localStorage.getItem(chave) === 'true';
            
            if (medalhaConcluida) {
                card.classList.remove('bloqueada');
                card.classList.add('ativa');
                card.dataset.status = "desbloqueado";
                if (statusTexto) statusTexto.textContent = 'Desbloqueado';
            } else {
                card.classList.remove('ativa');
                card.classList.add('bloqueada');
                card.dataset.status = "bloqueado";
                if (statusTexto) statusTexto.textContent = 'Bloqueado';
            }
        });
    }

    const cards = document.querySelectorAll(".card-medalha");
    const modal = document.getElementById("modalConquista");
    const conteudoModal = document.getElementById("conteudoModal");
    const btnFechar = document.getElementById("btnFecharModal");
    
    cards.forEach(card => {
        card.addEventListener("click", () => {
            const status = card.dataset.status;
            const titulo = card.dataset.titulo;
    
            if(status === "desbloqueado"){
                conteudoModal.innerHTML = `
                    <div class="modal-header">
                        <span class="tag-sucesso">🎵 Conquista Desbloqueada</span>
                        <h2>${titulo}</h2>
                    </div>
                    <div class="estrelas">⭐ ⭐ ⭐</div>
                    <div class="modal-secao">
                        <h3>🏆 O que você conquistou?</h3>
                        <p>${card.dataset.conquistou || ''}</p>
                    </div>
                    <div class="modal-secao">
                        <h3>📖 O que você aprendeu?</h3>
                        <p>${card.dataset.aprendeu || ''}</p>
                    </div>
                    <div class="modal-secao incentivo">
                        <p>💙 <strong>${card.dataset.incentivo || ''}</strong></p>
                    </div>
                `;
            } else {
                conteudoModal.innerHTML = `
                    <div class="modal-header">
                        <span class="tag-bloqueado">🔒 Medalha Bloqueada</span>
                        <h2>${titulo}</h2>
                    </div>
                    <div class="estrelas bloqueadas">☆ ☆ ☆</div>
                    <div class="modal-secao">
                        <h3>Você ainda não conquistou esta medalha.</h3>
                        <p>Finalize a lição correspondente na trilha com aproveitamento superior a 50% para desbloqueá-la.</p>
                    </div>
                `;
            }
            modal.classList.add("visivel");
        });
    });
    
    btnFechar.addEventListener("click", () => modal.classList.remove("visivel"));
    modal.addEventListener("click", (e) => { if(e.target === modal) modal.classList.remove("visivel"); });
    document.addEventListener("keydown", (e) => { if(e.key === "Escape") modal.classList.remove("visivel"); });
    document.addEventListener('DOMContentLoaded', atualizarMedalhasPeloProgresso);


// Adicione isto no fim da tag <script> existente no seu medalhas.html
    document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('recompensa') === 'true') {
        const tituloMedalha = params.get('titulo');
        
        // Localiza o card correspondente à medalha que ele acabou de ganhar
        const cardPremiado = Array.from(document.querySelectorAll('.card-medalha')).find(c => c.dataset.titulo === tituloMedalha);
        
        if (cardPremiado) {
            // Rola a página suavemente até ela e aplica um efeito temporário de flash dourado vibrante
            cardPremiado.scrollIntoView({ behavior: 'smooth', block: 'center' });
            cardPremiado.style.transition = "all 0.5s ease";
            cardPremiado.style.borderColor = "#ffd43b";
            cardPremiado.style.boxShadow = "0 0 30px #ffd43b, 0 0 60px rgba(255,212,59,0.4)";
            
            // Força a abertura automática do modal de comemoração após 1 segundo
            setTimeout(() => {
                cardPremiado.click();
            }, 1000);
        }
    }
});

</script>
</body>
</html>
